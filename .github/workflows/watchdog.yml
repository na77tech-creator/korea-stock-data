# 외부 파수꾼 (aikstockdata.com 개편 마스터플랜 P2-5)
# 클라우드PC 파이프라인·Cloudflare Worker·미러 워크플로우 어디가 죽어도
# GitHub 인프라에서 독립적으로 감지한다. 성공 시 완전 침묵, 실패 시에만 Issue(+텔레그램).
# ※ mirror.yml(데일리 미러)과는 완전히 별개 — 서로 건드리지 않는다.

name: Site watchdog

on:
  schedule:
    # ★[2026-09-08] 이 일정이 낡아서 **한 달 반 동안 매일 거짓 경보**를 냈다.
    #   원래 주석: "10:00/16:00 수집 파이프라인 종료 40분 뒤". 그 뒤 발행이 **18:10** 으로
    #   옮겨졌는데 파수꾼은 안 옮겨졌다. 그래서 (a) 기준일 검사가 **발행 전에** 돌았고,
    #   홈은 늘 어제 날짜를 들고 있어 매번 실패했다(이슈 #1 에 댓글 38개가 그 흔적이다).
    #   늑대가 매일 나타나면 진짜 늑대를 못 본다 — 실제로 09-04·09-07 발행 결번이
    #   이 소음에 묻혔다.
    # KST 10:40 (평일) — 가용성만 본다((b)(c)). 발행 전이라 신선도는 보지 않는다.
    - cron: "40 1 * * 1-5"
    # KST 18:50 (평일) — 발행(18:10) 40분 뒤. 여기서 신선도((a))까지 본다.
    - cron: "50 9 * * 1-5"
  workflow_dispatch:

# 실패 진단 Issue 생성을 위해 기본 GITHUB_TOKEN에 issues:write 명시
permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: "https://aikstockdata.com"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # (c) 최신 커밋 시각만 필요

      - name: Run checks
        id: checks
        shell: bash
        run: |
          set -u
          # KST 주말이면 전체 스킵 (cron은 평일에만 돌지만 수동 실행 대비 이중 가드)
          DOW=$(TZ=Asia/Seoul date +%u)   # 1=월 ... 7=일
          if [ "$DOW" -ge 6 ]; then
            echo "KST weekend - skip all checks"
            exit 0
          fi

          TODAY_DOT=$(TZ=Asia/Seoul date +%Y.%m.%d)
          TODAY_DASH=$(TZ=Asia/Seoul date +%Y-%m-%d)
          FAILS=""
          add_fail() { FAILS="${FAILS}- $1"$'\n'; }

          # [2026-07-19 법률 준수 재편] 데이터 URL(/data/*)은 인증 게이트(410)로 차단됨 —
          # 파수꾼은 공개 페이지의 기준시각 메타(data-baseline-date)로 신선도를 판정한다.
          # 미러(mirror.yml)는 중단됐으므로 (c) 신선도 검사는 폐지.

          # ---- (a) 홈 페이지의 기준일 메타 == KST 오늘 ----
          # ★[2026-09-08] **발행(18:10) 뒤에만** 이 검사를 한다. 크론 문자열로 가르지 않고
          #   실행 시각(KST)으로 가른다 — 수동 실행(workflow_dispatch)에서도 맞아야 하고,
          #   크론을 또 옮길 때 이 조건을 같이 고치는 걸 잊으면 같은 사고가 반복된다.
          HOUR=$(TZ=Asia/Seoul date +%H)
          if [ "$HOUR" -lt 18 ]; then
            echo "(a) skipped - KST ${HOUR}시, 발행(18:10) 전이라 기준일은 어제가 정상이다"
          elif curl -fsSL --max-time 60 --retry 2 "$BASE/" -o /tmp/home.html; then
            KIJUN=$(grep -o 'name="data-baseline-date" content="[^"]*"' /tmp/home.html | head -1 | sed 's/.*content="//;s/"//')
            if [ -z "$KIJUN" ]; then
              add_fail "(a) homepage baseline-date meta missing - build may be broken"
            elif [ "$KIJUN" != "$TODAY_DOT" ] && [ "$KIJUN" != "$TODAY_DASH" ]; then
              KDASH=$(printf '%s' "$KIJUN" | tr '.' '-')
              AGE=$(( ( $(TZ=Asia/Seoul date +%s) - $(date -u -d "$KDASH" +%s 2>/dev/null || echo 0) ) / 86400 ))
              add_fail "(a) homepage baseline-date='$KIJUN' != KST today '$TODAY_DOT' (about ${AGE} day(s) stale) - pipeline may be dead / serving stale build (KR market holiday would be a false positive)"
            fi
          else
            add_fail "(a) homepage fetch failed: $BASE/"
          fi

          # ---- (b) 핵심 공개 페이지 HTTP 200 (데이터 URL 제외) ----
          # .html 경로는 Workers Assets가 307로 확장자를 벗기므로 -L로 최종 상태를 본다
          for u in "/" "/watch" "/notices" "/sitemap.xml"; do
            CODE=$(curl -sSL -o /dev/null -w "%{http_code}" --max-time 60 --retry 2 "$BASE$u" || echo "000")
            if [ "$CODE" != "200" ]; then
              add_fail "(b) endpoint $u -> HTTP $CODE"
            fi
          done

          # ---- (c) 데이터 게이트 실효성 — /data/latest.json 이 무인증으로 200이면 안 됨 ----
          GCODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "$BASE/data/latest.json" || echo "000")
          if [ "$GCODE" = "200" ]; then
            add_fail "(c) DATA GATE BREACH: /data/latest.json returned 200 without auth (expected 410) - compliance gate is down"
          fi

          # ---- 판정: 실패 목록이 있으면 진단을 출력으로 넘기고 실패 처리 ----
          if [ -n "$FAILS" ]; then
            {
              echo "diagnosis<<DIAG_EOF"
              printf '%s' "$FAILS"
              echo ""
              echo "DIAG_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "WATCHDOG FAIL:"
            printf '%s' "$FAILS"
            exit 1
          fi
          echo "All checks passed (silent success)"

      # 실패 시에만: 진단 Issue 생성. 이미 열린 watchdog Issue가 있으면 코멘트로 갱신(스팸 방지)
      - name: Create or update diagnosis issue
        if: failure()
        uses: actions/github-script@v7
        env:
          DIAGNOSIS: ${{ steps.checks.outputs.diagnosis }}
        with:
          script: |
            const diagnosis = (process.env.DIAGNOSIS || '').trim()
              || '- (no diagnosis captured - see the failed step log)';
            const kst = new Date(Date.now() + 9 * 3600 * 1000)
              .toISOString().replace('T', ' ').slice(0, 16);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              '## aikstockdata.com watchdog failure',
              '',
              `- Detected at (KST): ${kst}`,
              `- Run: ${runUrl}`,
              '',
              '### Diagnosis',
              diagnosis,
              '',
              '### Where to look',
              '1. Cloud PC scheduled tasks (KST 10:00 / 16:00 pipeline) - did they run and deploy?',
              '2. Cloudflare Worker / custom domain (aikstockdata.com) status',
              '3. If (c) DATA GATE BREACH: worker.js auth gate / run_worker_first deploy config',
              '',
              '_Note: on a Korean market holiday, check (a) is expected to fail (false positive)._',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'watchdog',
              per_page: 1,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[watchdog] site check failed (${kst} KST)`,
                body,
                labels: ['watchdog'],
              });
            }

      # 실패 시에만 + 리포 시크릿 2종이 모두 있을 때만 텔레그램 시도. 없으면 Issue만.
      # ★공개 채널 ID 하드코딩 금지 — 반드시 관리자 개인 chat_id 시크릿만 사용한다.
      - name: Telegram alert (only if admin secrets exist)
        if: failure()
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DIAGNOSIS: ${{ steps.checks.outputs.diagnosis }}
        run: |
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "Telegram secrets not set - issue only"
            exit 0
          fi
          TEXT=$(printf '[watchdog] aikstockdata.com check FAILED (KST %s)\n%s\nhttps://github.com/%s/issues' \
            "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" \
            "${DIAGNOSIS:-see GitHub issue}" \
            "${GITHUB_REPOSITORY}")
          curl -fsS --max-time 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" > /dev/null \
            || echo "telegram send failed (non-fatal)"
