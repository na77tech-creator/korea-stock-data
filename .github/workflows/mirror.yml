name: Daily data mirror

on:
  schedule:
    - cron: "20 8 * * 1-5" # 17:20 KST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest data from site
        run: |
          BASE="https://wispy-truth-8d32.na4tech.workers.dev"
          TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
          mkdir -p data/csv
          curl -fsS "$BASE/data/latest.json" -o data/latest.json
          curl -fsS "$BASE/data/universe_${TODAY}.csv" -o "data/csv/universe_${TODAY}.csv" \
            || echo "No CSV for ${TODAY} (market holiday?) — skipping"

      - name: Commit if changed
        run: |
          git config user.name "data-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d) daily mirror"
            git push
          fi
